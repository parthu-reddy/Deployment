spring:
  application:
    name: reviews-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reviews_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:password}

resilience4j:
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms

server:
  # 8085 was hardcoded here and belongs to payment-gateway (docker-compose.yml publishes 8085:8085
  # for it). This service publishes 8099:8099 and healthchecks 8099, while compose passes
  # SERVER_PORT=8099 -- which a literal here overrides, since the config server's property source
  # outranks the environment. The container therefore bound a port nobody probed, on a number
  # already taken. ${SERVER_PORT:8099} agrees with compose under either precedence and matches the
  # form wallet, campaign, bidding and event-tracking already use.
  port: ${SERVER_PORT:8099}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka}
  instance:
    prefer-ip-address: true


