server:
  shutdown: graceful

spring:
  main:
    allow-bean-definition-overriding: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
  datasource:
    hikari:
      maximum-pool-size: 5
  flyway:
    locations: classpath:db/migration,classpath:db/migration/common
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      validate-group-membership: false
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,diskSpace
  tracing:
    enabled: true
    sampling:
      # Was 1.0 -- every request produced a trace, all retained by jaeger in memory. Over 14 days
      # that reached 3.1 GB on a 23 GB box and starved the host (2026-08-30). Sample a fraction;
      # raise it temporarily when actually chasing something.
      probability: ${TRACING_SAMPLE_RATE:0.1}

  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: false

logging:
  file:
    name: logs/${spring.application.name}.log
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] [%t] %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

# Eureka Service Discovery (default for all services)
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka}
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 15
    lease-expiration-duration-in-seconds: 30
    instance-id: ${spring.application.name}:${random.value}

r2:
  access-key: ${R2_ACCESS_KEY_ID:}
  secret-key: ${R2_SECRET_ACCESS_KEY:}
  endpoint: ${R2_ENDPOINT:}
  bucket-name: ${R2_BUCKET_NAME:labouffe}
  public-url: ${R2_PUBLIC_URL:https://80708a753745ca23eabc20b4b3dee5fa.r2.cloudflarestorage.com}

# Auction price signing (BiddingEngine issues, UserTrackingService verifies).
# The two MUST share the same value or every tracking pixel is rejected.
# Override with AUCTION_TOKEN_SECRET in every non-dev environment.
platform:
  auction:
    token-secret: ${AUCTION_TOKEN_SECRET:}


