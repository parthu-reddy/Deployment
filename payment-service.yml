spring:
  task:
    execution:
      pool:
        core-size: 10
        max-size: 100
        queue-capacity: 500
        thread-name-prefix: "webhook-worker-"
  application:
    name: payment-service
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:password}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    properties:
      spring.json.add.type.headers: false

resilience4j.circuitbreaker:
  instances:
    gatewayCB:
      registerHealthIndicator: true
      slidingWindowSize: 10
      minimumNumberOfCalls: 5
      permittedNumberOfCallsInHalfOpenState: 3
      automaticTransitionFromOpenToHalfOpenEnabled: true
      waitDurationInOpenState: 5s
      failureRateThreshold: 50
      eventConsumerBufferSize: 10

server:
  port: ${PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# Gateway credentials.
#
# Split by profile on purpose. Under prod these must come from the vault and there is no fallback,
# so a deployment missing one refuses to start. Outside prod the placeholders below are what the
# properties resolve to -- only the Mock*Strategy beans are registered there
# (@Profile("!prod & (debug | dev | default | test | local)")), so nothing ever calls a gateway with
# them, and a developer can bring the stack up with no secrets at all.
#
# Removing the old test_-prefixed defaults without scoping them to a profile left ${RAZORPAY_KEY_ID}
# unresolvable, and the payment service could not start in dev either.
---
spring:
  config:
    activate:
      on-profile: "!prod"

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:dev-placeholder-not-a-credential}
    secret: ${RAZORPAY_KEY_SECRET:dev-placeholder-not-a-credential}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:dev-placeholder-not-a-credential}

cashfree:
  client:
    id: ${CASHFREE_CLIENT_ID:dev-placeholder-not-a-credential}
    secret: ${CASHFREE_CLIENT_SECRET:dev-placeholder-not-a-credential}

vyapargateway:
  api:
    key: ${VYAPAR_API_KEY_SECRET:dev-placeholder-not-a-credential}
  base:
    url: ${VYAPAR_BASE_URL:http://localhost:9999/mock-vyapar}
  webhook:
    secret: ${VYAPAR_WEBHOOK_SIGNING_SECRET:dev-placeholder-not-a-credential}

---
spring:
  config:
    activate:
      on-profile: prod

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID}
    secret: ${RAZORPAY_KEY_SECRET}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET}

cashfree:
  client:
    id: ${CASHFREE_CLIENT_ID}
    secret: ${CASHFREE_CLIENT_SECRET}

vyapargateway:
  api:
    key: ${VYAPAR_API_KEY_SECRET}
  base:
    url: ${VYAPAR_BASE_URL:https://api.vyapargateway.com/v1}
  webhook:
    secret: ${VYAPAR_WEBHOOK_SIGNING_SECRET}



eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka}
  instance:
    prefer-ip-address: true


