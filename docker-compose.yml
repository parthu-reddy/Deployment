version: '3.8'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: shared_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
    - 2181:2181
    restart: unless-stopped
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: shared_kafka
    depends_on:
    - zookeeper
    ports:
    - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://shared_kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test:
      - CMD
      - kafka-broker-api-versions
      - --bootstrap-server
      - localhost:9092
      interval: 15s
      timeout: 20s
      retries: 15
      start_period: 120s
    restart: unless-stopped

  postgres:
    image: kartoza/postgis:16-3.4
    container_name: shared_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASS: ${POSTGRES_PASS}
      POSTGRES_EXTRA_OPTS: -c max_connections=500
      EXTRA_CONF: "wal_level=logical"
    ports:
    - 5433:5432
    volumes:
    - shared_pgdata:/var/lib/postgresql/data
    - ./init-multiple-dbs.sql:/docker-entrypoint-initdb.d/init-multiple-dbs.sql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h localhost -U postgres
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
  redis:
    image: redis:7.2
    container_name: shared_redis
    ports:
    - 6379:6379
    volumes:
    - shared_redis_data:/data
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --save
    - '60'
    - '1'
    - --loglevel
    - warning
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s
  config-service:
    build:
      context: ../
      dockerfile: ConfigService/Dockerfile
    container_name: config-service
    user: root
    ports:
    - 8888:8888
    volumes:
    - ./:/config
    environment:
    - SPRING_PROFILES_ACTIVE=native
    - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/config
    - SPRING_CONFIG_IMPORT=optional:file:/config/config-service.yml
    - CONFIG_USER=${CONFIG_USER}
    - CONFIG_PASSWORD=${CONFIG_PASSWORD}
    - EUREKA_CLIENT_ENABLED=false
    healthcheck:
      test:
      - CMD-SHELL
      - wget --spider --user=$${CONFIG_USER} --password=$${CONFIG_PASSWORD} http://localhost:8888/actuator/health
        || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
  eureka-server-1:
    build:
      context: ../
      dockerfile: EurekaServer/Dockerfile
    container_name: eureka-server-1
    ports:
    - 8761:8761
    environment:
    - EUREKA_USER=${EUREKA_USER:-admin}
    - EUREKA_PASSWORD=${EUREKA_PASSWORD:-admin}
    - PLATFORM_BUSINESS_ZONE=${PLATFORM_BUSINESS_ZONE:-Asia/Kolkata}
    - PLATFORM_DEFAULT_CURRENCY=${PLATFORM_DEFAULT_CURRENCY:-INR}
    - EUREKA_HOSTNAME=eureka-server-1
    - EUREKA_CLIENT_REGISTER_WITH_EUREKA=true
    - EUREKA_CLIENT_FETCH_REGISTRY=true
    - EUREKA_DEFAULT_ZONE=http://${EUREKA_USER:-admin}:${EUREKA_PASSWORD:-admin}@eureka-server-2:8761/eureka/
    healthcheck:
