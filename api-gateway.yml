server:
  port: 8080
spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:password}
  cloud:
    gateway:
      default-filters:
      - name: Retry
        args:
          retries: 3
          statuses: BAD_GATEWAY, GATEWAY_TIMEOUT, SERVICE_UNAVAILABLE
          methods: GET
          backoff:
            firstBackoff: 50ms
            maxBackoff: 500ms
            factor: 2
            basedOnPreviousValue: false
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${ALLOWED_ORIGINS:http://localhost:3000}
            allowedOriginPatterns: ${ALLOWED_ORIGIN_PATTERNS:}
            allowedMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
            allowedHeaders: '*'

      # Rate limiting is declared per route below, NOT here. Spring Cloud Gateway ADDS every
      # default-filter to a route's chain instead of letting the route override it, so a route
      # asking for a higher rate still got the stricter default and the two buckets both
      # charged. That capped the Ola tile proxy at 40 burst, and silently defeated the 20/100 that
      # identity-service declared for itself -- it was getting 40. Verified against
      # /actuator/gateway/routes on 2026-09-10. Any new route MUST carry its own
      # RequestRateLimiter; validate_core_services.py check GW-RATELIMIT enforces that.
      routes:
      - id: customer-service
        uri: lb://customer-service
        predicates:
        # /api/v1/customer (singular) is CustomerOrderController's refund-request surface; the plural
        # /api/v1/customers/** above does not match it. /api/v1/money/{customer,restaurant,driver} is
        # the money BFF that also lives in CustomerApplication -- only the advertiser slice of that
        # surface is served elsewhere (wallet-service, below). Added 2026-09-10: none of these were
        # routed here, so every wallet, earnings and refund screen 404'd in a real deployment.
        - Path=/api/v1/customers/**,/api/v1/customer/**,/api/v1/orders/**,/api/v1/places/**,
          /api/v1/restaurants/nearby, /api/v1/restaurants/brands/*/outlets,
          /api/v1/restaurants/*/delivery-availability, /api/v1/restaurants/*/delivery-pricing,
          /api/v1/money/customer/**, /api/v1/money/restaurant/**, /api/v1/money/driver/**,
          /api/v1/internal/admin/orders/**, /api/v1/internal/admin/customers/**,
          /api/v1/internal/admin/refunds/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: restaurant-service
        uri: lb://restaurant-service
        predicates:
        - Path=/api/v1/brands/**,/api/v1/restaurants/**,/api/v1/outlets/**,/api/v1/categories/**,
          /api/v1/internal/admin/restaurants/**, /api/v1/images/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: delivery-service
        uri: lb://delivery-service
        predicates:
        - Path=/api/delivery/**,/api/v1/delivery/**,/api/v1/logistics/**,/api/v1/internal/admin/delivery/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: identity-service
        uri: lb://identity-service
        predicates:
        - Path=/api/v1/internal/auth/**,/api/v1/internal/users/**,/api/v1/users/**,
          /api/v1/internal/admin/users/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 100
            key-resolver: '#{@ipKeyResolver}'
      - id: payment-service
        uri: lb://payment-service
        predicates:
        - Path=/api/v1/webhooks/**,/api/v1/payments/**
      # Ola Maps tile/places proxy. nginx forwards /olamaps/ here (its own comment says
      # "via Api Gateway"), but no route existed, so every tile request 404'd and maps have
      # never rendered in this deployment. Mirrors FoodDeliveryAppUI/server.ts, which is the
      # dev-time proxy and is NOT running in production -- nginx serves the built assets instead.
      # The key stays server-side; the browser never sees it.
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: olamaps-proxy
        uri: https://api.olamaps.io
        predicates:
        - Path=/olamaps/**
        filters:
        # Spring Cloud Gateway forwards the incoming Host header by default. In production,
        # nginx passes the browser's Host (e.g. 140.245.234.137) which Ola Maps rejects
        # with 403. This filter ensures api.olamaps.io sees its own hostname.
        - SetRequestHostHeader=api.olamaps.io
        # Map tiles, not API calls. A cold MapLibre load of a 1440x820 map measured 33 requests with
        # 31 of them inside one second (style, 3 TileJSONs, sprite, 3 glyph ranges, and 12 vector tiles
        # per source), and panning immediately asks for more. Against the old shared 40-token bucket a
        # single map consumed ~78% of it in one second, leaving almost nothing for the page's own API
        # calls -- and MapLibre never retries a tile the gateway rejects, so a 429 leaves a permanently
        # blank square. Ola serves tiles with max-age=3600, so a warm browser costs nothing and this
        # bucket only has to absorb the cold load. Measured 2026-09-10.
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 100
            redis-rate-limiter.burstCapacity: 400
            key-resolver: '#{@ipKeyResolver}'
        - RewritePath=/olamaps/(?<segment>.*),/$\{segment}
        - AddRequestParameter=api_key, ${OLA_MAPS_API_KEY:}
      - id: maps-service
        uri: lb://mapsintegration
        predicates:
        - Path=/api/places/**,/api/fleet/**,/api/config/maps-key,/api/logistics/**,
          /api/maps/tracking
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: notification-service
        uri: lb://notification-service
        predicates:
        - Path=/webhooks/providers/**,/api/v1/notifications/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: government-id-service
        uri: lb://government-id-validation-service
        predicates:
        - Path=/api/v1/verification/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: ledger-service
        uri: lb://ledger-service
        predicates:
        - Path=/api/v1/ledger/**,/api/v1/internal/admin/payouts/**,
          /api/v1/internal/admin/ledger/**, /api/v1/internal/admin/cash/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: chat-service
        uri: lb://chat-service
        predicates:
        - Path=/api/v1/chat/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: chat-service-ws
        uri: lb:ws://chat-service
        predicates:
        - Path=/ws/chat/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
#      - id: ondc-integration-service
#        uri: lb://ondc-integration-service
#        predicates:
#        - Path=/ondc/**,/search,/select,/init,/confirm,/cancel,/status,/track,
#          /update, /rating, /on_search, /on_select, /on_init, /on_confirm, /on_cancel,
#          /on_status, /on_track
      - id: campaign-service
        uri: lb://campaign-service
        predicates:
        - Path=/api/v1/advertisers/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: bidding-engine
        uri: lb://bidding-engine
        predicates:
        - Path=/api/v1/bidding/**,/api/v1/ads/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: event-tracking-service
        uri: lb://event-tracking-service
        predicates:
        - Path=/api/v1/tracking/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: wallet-service
        uri: lb://wallet-service
        predicates:
        - Path=/api/v1/wallets/**,/api/v1/money/advertiser/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      # Added 2026-09-11. reviews-service has existed and been declared in docker-compose since
      # August, but no route ever pointed at it, so /api/v1/reviews was a 404 from the browser and a
      # 403 from the rbac table's default-deny. The admin prefix rides the same route: mounting it
      # under /api/v1/internal/admin/ is what keeps GlobalJwtAuthFilter's internal-path block from
      # rejecting it, since that filter carves out exactly that prefix.
      - id: reviews-service
        uri: lb://reviews-service
        predicates:
        - Path=/api/v1/reviews/**,/api/v1/internal/admin/reviews/**
        filters:
        # Its own limiter, not the default-filters block: those STACK rather than override, so a
        # route without one still gets charged twice. GW-RATELIMIT in validate_core_services.py
        # fails a route that omits this.
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
      - id: service-docs-customer
        uri: lb://customer-service
        predicates:
        - Path=/service-docs/customer-service/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: '#{@ipKeyResolver}'
        - RewritePath=/service-docs/customer-service/(.*),/$1
      - id: service-docs-restaurant
        uri: lb://restaurant-service
        predicates:
        - Path=/service-docs/restaurant-service/**
