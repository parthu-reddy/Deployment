eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 15
    lease-expiration-duration-in-seconds: 30
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,env
rbac:
  rules:
    authenticated:
    - /api/v1/users
    - /api/v1/internal/auth/sessions
    - /api/v1/internal/auth/logout
    - /api/v1/verification
    customer:
    - /api/v1/customers
    # Singular. CustomerOrderController serves /api/v1/customer/orders/**, which the plural prefix
    # above does not match -- rbac matches on `equals` or `startsWith(prefix + "/")`.
    - /api/v1/customer
    - /api/v1/money/customer
    - /api/v1/orders
    - /api/v1/places
    - /api/v1/payments
    - /api/places
    - /api/maps
    - /api/config
    - /api/v1/ledger
    - /api/v1/chat
    - /ws/chat
    - /api/v1/tracking
    - /api/v1/logistics/route
    # The customer writes reviews and reads restaurant/product ones. Prefix matching is
    # equals || startsWith(prefix + "/"), so this single entry covers the whole surface.
    - /api/v1/reviews
    restaurant:
    - /api/v1/restaurants
    - /api/v1/brands
    - /api/v1/outlets
    - /api/v1/categories
    - /api/v1/logistics
    - /api/v1/images
    - /api/places
    - /api/maps
    - /api/config
    - /api/v1/ledger
    - /api/v1/chat
    - /ws/chat
    - /api/v1/advertisers
    - /api/v1/wallets
    - /api/v1/money/restaurant
    - /api/v1/money/advertiser
    # Read-only in practice: an owner sees their outlet's reviews. Writing is refused by
    # ReviewController's hasRole('CUSTOMER'), and eligibility would refuse it regardless.
    - /api/v1/reviews
    delivery:
    - /api/v1/images
    - /api/v1/money/driver
    - /api/v1/logistics
    - /api/v1/delivery
    - /api/delivery
    - /api/logistics
    - /api/fleet
    - /api/places
    - /api/maps
    - /api/config
    - /api/v1/ledger
    - /api/v1/chat
    - /ws/chat
    # A driver reads their own rating. ReviewAccessPolicy restricts EntityType.DRIVER to the
    # driver themself, so reaching the route is not the same as reading someone else's.
    - /api/v1/reviews
