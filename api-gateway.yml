server:
  port: 8080
spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:password}
  cloud:
    gateway:
      default-filters:
      - name: RequestRateLimiter
        args:
          redis-rate-limiter.replenishRate: 20
          redis-rate-limiter.burstCapacity: 40
          key-resolver: '#{@ipKeyResolver}'
      - name: Retry
        args:
          retries: 3
          statuses: BAD_GATEWAY, GATEWAY_TIMEOUT, SERVICE_UNAVAILABLE
          methods: GET
          backoff:
            firstBackoff: 50ms
            maxBackoff: 500ms
            factor: 2
            basedOnPreviousValue: false
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${ALLOWED_ORIGINS:http://localhost:3000}
            allowedMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
            allowedHeaders: '*'
      routes:
      - id: customer-service
        uri: lb://customer-service
        predicates:
        - Path=/api/v1/customers/**, /api/v1/orders/**, /api/v1/places/**, /api/v1/restaurants/nearby,
          /api/v1/restaurants/brands/*/outlets, /api/v1/restaurants/*/delivery-availability,
          /api/v1/restaurants/*/delivery-pricing, /api/v1/internal/admin/orders/**,
          /api/v1/internal/admin/customers/**
      - id: restaurant-service
        uri: lb://restaurant-service
        predicates:
        - Path=/api/v1/brands/**, /api/v1/restaurants/**, /api/v1/outlets/**, /api/v1/categories/**,
          /api/v1/internal/admin/restaurants/**, /api/v1/images/**
      - id: delivery-service
        uri: lb://delivery-service
        predicates:
        - Path=/api/delivery/**, /api/v1/delivery/**, /api/v1/logistics/**, /api/v1/internal/admin/delivery/**
      - id: identity-service
        uri: lb://identity-service
        predicates:
        - Path=/api/v1/internal/auth/**, /api/v1/internal/users/**, /api/v1/users/**
        filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 100
            key-resolver: '#{@ipKeyResolver}'
      - id: payment-service
        uri: lb://payment-service
        predicates:
        - Path=/api/v1/webhooks/**, /api/v1/payments/**
      - id: maps-service
        uri: lb://mapsintegration
        predicates:
        - Path=/api/places/**, /api/fleet/**, /api/config/maps-key, /api/logistics/**,
          /api/maps/tracking
      - id: notification-service
        uri: lb://notification-service
        predicates:
        - Path=/webhooks/providers/**, /api/v1/notifications/**
      - id: government-id-service
        uri: lb://government-id-validation-service
        predicates:
        - Path=/api/v1/verification/**
      - id: ledger-service
        uri: lb://ledger-service
        predicates:
        - Path=/api/v1/ledger/**
      - id: chat-service
        uri: lb://chat-service
        predicates:
        - Path=/api/v1/chat/**
      - id: chat-service-ws
        uri: lb:ws://chat-service
        predicates:
        - Path=/ws/chat/**
#      - id: ondc-integration-service
#        uri: lb://ondc-integration-service
#        predicates:
#        - Path=/ondc/**, /search, /select, /init, /confirm, /cancel, /status, /track,
#          /update, /rating, /on_search, /on_select, /on_init, /on_confirm, /on_cancel,
#          /on_status, /on_track
      - id: campaign-service
        uri: lb://campaign-service
        predicates:
        - Path=/api/v1/campaigns/**, /api/v1/advertisers/**
      - id: bidding-engine
        uri: lb://bidding-engine
        predicates:
        - Path=/api/v1/bidding/**, /api/v1/ads/**
      - id: event-tracking-service
        uri: lb://event-tracking-service
        predicates:
        - Path=/api/v1/tracking/**
      - id: wallet-service
        uri: lb://wallet-service
        predicates:
        - Path=/api/v1/wallets/**
      - id: service-docs-customer
        uri: lb://customer-service
        predicates:
        - Path=/service-docs/customer-service/**
        filters:
        - RewritePath=/service-docs/customer-service/(.*), /$1
      - id: service-docs-restaurant
        uri: lb://restaurant-service
        predicates:
        - Path=/service-docs/restaurant-service/**
        filters:
        - RewritePath=/service-docs/restaurant-service/(.*), /$1
      - id: service-docs-delivery
        uri: lb://delivery-service
        predicates:
        - Path=/service-docs/delivery-service/**
        filters:
        - RewritePath=/service-docs/delivery-service/(.*), /$1
      - id: service-docs-identity
        uri: lb://identity-service
        predicates:
        - Path=/service-docs/identity-service/**
        filters:
        - RewritePath=/service-docs/identity-service/(.*), /$1
      - id: service-docs-payment
        uri: lb://payment-service
        predicates:
        - Path=/service-docs/payment-service/**
        filters:
        - RewritePath=/service-docs/payment-service/(.*), /$1
      - id: service-docs-maps
        uri: lb://mapsintegration
        predicates:
        - Path=/service-docs/mapsintegration/**
        filters:
        - RewritePath=/service-docs/mapsintegration/(.*), /$1
      - id: service-docs-notification
        uri: lb://notification-service
        predicates:
        - Path=/service-docs/notification-service/**
        filters:
        - RewritePath=/service-docs/notification-service/(.*), /$1
      - id: service-docs-ledger
        uri: lb://ledger-service
        predicates:
        - Path=/service-docs/ledger-service/**
        filters:
        - RewritePath=/service-docs/ledger-service/(.*), /$1
      - id: service-docs-chat
        uri: lb://chat-service
        predicates:
        - Path=/service-docs/chat-service/**
        filters:
        - RewritePath=/service-docs/chat-service/(.*), /$1
#      - id: service-docs-ondc
#        uri: lb://ondc-integration-service
#        predicates:
#        - Path=/service-docs/ondc-integration-service/**
#        filters:
#        - RewritePath=/service-docs/ondc-integration-service/(.*), /$1
      - id: service-docs-wallet
        uri: lb://wallet-service
        predicates:
        - Path=/service-docs/wallet-service/**
        filters:
        - RewritePath=/service-docs/wallet-service/(.*), /$1
      - id: service-docs-campaign
        uri: lb://campaign-service
        predicates:
        - Path=/service-docs/campaign-service/**
        filters:
        - RewritePath=/service-docs/campaign-service/(.*), /$1
      - id: service-docs-bidding
        uri: lb://bidding-engine
        predicates:
        - Path=/service-docs/bidding-engine/**
        filters:
        - RewritePath=/service-docs/bidding-engine/(.*), /$1
      - id: service-docs-gov-id
        uri: lb://government-id-validation-service
        predicates:
        - Path=/service-docs/government-id-validation-service/**
        filters:
        - RewritePath=/service-docs/government-id-validation-service/(.*), /$1
      - id: service-docs-event
        uri: lb://event-tracking-service
        predicates:
        - Path=/service-docs/event-tracking-service/**
        filters:
        - RewritePath=/service-docs/event-tracking-service/(.*), /$1
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 15
    lease-expiration-duration-in-seconds: 30
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,env
rbac:
