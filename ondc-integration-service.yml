spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/ondc_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  kafka:
    bootstrap-servers: kafka:29092

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:password}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URLS:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

ondc:
  subscriber-id: "bap.fooddelivery.com"
  subscriber-url: "https://bap.fooddelivery.com/ondc"
  domain: "ONDC:RET11"
  city: "std:080"
  country: "IND"
  registry-url: "https://staging.registry.ondc.org"
  crypto:
    private-signing-key: "default-key-dev-only"
    public-signing-key: "default-key-dev-only"
    private-encryption-key: "default-key-dev-only"
    public-encryption-key: "default-key-dev-only"
    uk-id: "default-uk-id"


